name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages is served via "Deploy from a branch" (main -> /docs) in
# repository Settings -> Pages. This workflow only rebuilds and validates
# the site as a CI sanity check; the committed docs/ folder is what Pages
# actually serves. The update-podcast workflow commits rebuilt docs/ back
# to main, so Pages stays in sync automatically.

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Rebuild site
        run: python scripts/build_site.py

      - name: Validate feed
        run: python scripts/validate_feed.py
